# Two-scenario grasp experiment (see "Two-Scenario Grasp Experiment" deck):
#   A  centred grasp      - fails by sliding straight down  -> thrust step
#   B  off-centre grasp   - fails by tilting/slipping round the fingers at
#                           1/4 length -> thrust + roll moment
#   E  empty-gripper control - same motion, cylinder parked out of reach
# One cylinder, one mass, one surface; only the grasp position changes.
# The difficulty knob is the grip force per scenario, tuned so 30-60 % of
# trials fail (use `experiment.sh tune`).
#
# All poses are Gazebo world ENU (x east, y north, z up), metres / radians.
# Keep table/cylinder poses in sync with worlds/x500_gripper_armbot.sdf.

world: x500_gripper_armbot
models:
  drone: x500_gripper
  arm: armbot
  cylinder: grasp_cylinder

cylinder:
  # Lying on the table top (z 1.015) with its axis along world Y.
  start_pose: [3.0, 0.0, 1.040, 1.5708, 0.0, 0.0]
  # E trials: parked on the same table, well out of the fingers' way.
  park_pose: [3.45, 0.28, 1.040, 1.5708, 0.0, 0.0]
  length_m: 0.12
  axis_world: [0.0, 1.0, 0.0]      # grasp offsets are measured along this

scenarios:
  # Tuned 2026-10-03 with `experiment.sh tune` (sim_data/*_tuneA, *_tuneB):
  # A: 1.30-1.39 N all failed (clean slides), >= 1.45 N mostly held; near
  #    1.5-1.6 N failures turn into "slip then pivot". 1.40 N ~ 50 % fails.
  # B: 1.8 and 2.2 N always failed (pivot round the fingers), 2.6 N 1/4,
  #    3-4 N held after rotating 9-22 deg. 2.4 N ~ 50 % fails.
  # Re-tune after changing the cylinder, pads or friction.
  A: {grasp_offset_m: 0.0,  grip_force_n: 1.40}
  B: {grasp_offset_m: 0.03, grip_force_n: 2.40}   # 1/4 of L = 120 mm from centre
  E: {grasp_offset_m: 0.0,  grip_force_n: 1.40}   # uses A's motion, nothing to grip

# Per-trial variability. Without it the simulator is nearly deterministic
# and every trial at a given grip force has the same outcome; these stand
# in for real-world grasp placement and actuator scatter. Logged per trial.
randomization:
  seed: 1
  grip_force_jitter_frac: 0.08     # 1-sigma, fraction of grip_force_n (force_fingers)
  claw_cmd_jitter_rad: 0.006       # 1-sigma, added to the jaw angle command (servo_claw);
                                   # stands for servo position error and linkage play (to tune)
  grasp_offset_jitter_m: 0.003     # 1-sigma, along the cylinder axis

protocol:
  variant: legacy                  # legacy | small_lift  (override: --variant)
  batteries: 30                    # A/B interleaved within every battery
  trials_per_battery: 10
  empty_per_battery: 1             # "E about every 10 trials" (override: --empty)

# Small-lift variant (Zimmer et al. 2019 adapted to the UAV; see 08_small_lift_plan.md).
# Phases after the close: small_lift -> lift -> hold -> shake (only if the grasp
# held) -> release. t0 = start of small_lift = the window anchor, and also the
# t_lift that outcome timings are measured from.
small_lift:
  sl_height_m: 0.15                # rise during the small-lift (SL) window (0.10 m tracked only 61 %)
  sl_duration_s: 1.5               # minimum-jerk profile, starts and ends at rest
  full_lift_height_m: 1.0          # total rise from the grasp height, SL included
  full_lift_peak_speed_mps: 0.30   # peak speed of the remaining minimum-jerk rise
  velocity_feedforward: true       # send the profile's velocity too, so the drone follows it
                                   # (PX4's position loop alone lags the setpoint by ~2 s)
  # Grip forces tuned 2026-10-17 for this profile (0.15 m / 1.5 s, feed-forward, 1.0 m lift): logistic
  # fit of held vs applied force over 127 valid trials gave 50 % held at 1.46 N (A, sharp) and 2.75 N
  # (B, shallower). The legacy forces (scenarios.A/B) stay for the 0.40 m lift. Re-tune after any change
  # to the profile, cylinder, pads or friction.
  grip_force_n: {A: 1.46, B: 2.75}
  # servo_claw: jaw angle command per scenario [rad]. Bench (claw_bench.py, cylinder on a
  # support, then hanging): -0.21 held at ~3.2 N per jaw, -0.24 dropped, 0.0 and above sit
  # at the torque limit (~4.1-4.5 N). FIRST GUESS, to be tuned in flight (experiment.sh tune).
  claw_cmd_rad: {A: -0.225, B: -0.21}
  put_down: false                  # set a held cylinder back on the table before opening (slow; leaves
                                   # the arm swinging, so the next alignment often fails)
  window_rate_hz: 50.0             # dataset grid (75 samples per SL window)
  baseline_s: 0.5                  # pre-SL hover used for mean subtraction (end of close)

# Stability shake after a successful hold. Positions are fractions of amplitude_m
# along axis_world, visited in order from the hold position.
shake:
  axis_world: [0.0, 1.0, 0.0]      # along the cylinder axis: friction carries the load
  amplitude_m: 0.3
  sequence: [1.0, -1.0, 0.0]       # centre -> +A -> -A -> centre
  leg_duration_s: 2.0              # minimum-jerk, per leg (1.0 s was too violent: 0 of 3 held grasps survived;
                                   # peak acceleration of the 0.6 m leg: 3.5 m/s^2 at 1 s, 0.9 m/s^2 at 2 s)
  settle_s: 0.5                    # hover after the last leg before labelling
  # step_stress: every held grasp gets the same escalating shake, one level per leg
  # duration (gentle -> harsh), until it fails; stable_level = levels survived and
  # y_stable = 1 if stable_level >= y_stable_min_level. per_scenario: one shake, with
  # the per_scenario overrides below (the force_fingers batch used this).
  mode: step_stress
  step_stress:
    levels_leg_s: [3.0, 2.25, 1.5, 1.0]
    y_stable_min_level: 2
  # Per-scenario intensity (overrides the keys above), tuned 2026-11-11 so each scenario's held grasps
  # are a mix of stable and unstable. One shared shake made y_stable follow the scenario (A 1 of 10
  # stable, B 7 of 8). Unstable share of held grasps vs A leg time: 2.0 s ~79 %, 2.15 s 62 %, 2.4 s 9 %,
  # 3.0 s 0 %; B at 1.25 s: 11 of 34 (32 %). Re-tune after changing the forces, cylinder, pads or friction.
  per_scenario:
    A: {leg_duration_s: 2.25}
    B: {leg_duration_s: 1.25}

motion:
  cruise_alt_m: 2.4                # drone (model frame) z while transiting
  approach_clearance_m: 0.12       # grasp point above target before descent
  grasp_z_offset_m: 0.006          # grasp slightly above the axis: fingertips clear the table
  transit_speed_mps: 0.6
  descend_speed_mps: 0.10
  lift_height_m: 0.40
  lift_speed_mps: 0.30
  baseline_s: 1.0                  # recorded hover before descent
  settle_s: 1.0                    # hover at grasp height before closing
  close_wait_s: 1.0                # fingers closing, before lift
  hold_s: 4.0                      # hold at lift height (outcome window)
  align_tol_m: 0.004
  align_timeout_s: 40.0
  heading_ned_rad: 1.5708          # face +x (east): arm forward over the table

arm:
  stow_pose:  {base_yaw: 0.0, shoulder_pitch: 0.0,   elbow_pitch: 0.0}
  reach_pose: {base_yaw: 0.0, shoulder_pitch: -1.45, elbow_pitch: -0.12}   # straight down

gripper:
  # servo_claw: the two-jaw claw of Armbot/model.sdf (branch feature/servo-claw), commanded
  # by jaw angle like the real hobby servo. force_fingers: the earlier force-controlled
  # parallel fingers (branch feature/small-lift-protocol); the force keys below are theirs.
  type: servo_claw
  claw:
    open_cmd_rad: -0.6             # jaws open (each jaw ~34 deg out from parallel)
    missed_grasp_force_n: 0.2      # left + right pad force below this after the close = missed
  open_force_n: -2.0
  missed_grasp_travel_m: 0.030     # finger closed past this = nothing between the pads

outcome:
  slip_onset_m: 0.010              # cylinder moved this far relative to the grasp point
  drop_m: 0.040                    # ... and this far = dropped (trial failed)
  tilt_fail_deg: 45.0              # axis rotated this far = failed even if still hanging
  tilt_threshold_deg: 15.0         # tilt change at slip onset: "tilt" vs "slide"

px4:
  # Emulate a motion-capture lab: Gazebo ground truth is fed to EKF2 as
  # external vision and GPS/baro fusion is switched off (mocap.py), so the
  # hover is accurate to millimetres. false = stock GPS estimate (cm wander,
  # grasps will often miss).
  mocap: true
  bin_dir: ~/PX4-Autopilot/build/px4_sitl_default/bin
  log_dir: ~/PX4-Autopilot/build/px4_sitl_default/rootfs/log
  sdlog_profile_or: 16             # add "high rate" logging (thrust/torque/motors at full rate)
  params:
    NAV_DLL_ACT: 0                 # no GCS needed (headless runs)
    COM_RCL_EXCEPT: 4              # no RC-loss failsafe in offboard
