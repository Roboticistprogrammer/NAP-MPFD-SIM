# SC-02: Full grasp-lift-hold-release cycle (Scenarios.md)
# "Approach -> grasp -> lift -> hold -> lower -> release"
scenario_id: SC02
hover_pose:
  x: 0.0
  y: 0.0
  z: -2.0
  yaw: 0.0
hold_duration_s: 5.0
condition_label: normal
land_at_end: true
outcome_z_drop_threshold_m: 0.02
outcome_sample_interval_s: 0.5

# Pre-grasp pose the arm approaches through before the final grasp_pose
# (from objects.yaml) — placeholder, same "not tried live yet" caveat
# as objects.yaml's grasp_pose values.
approach_pose:
  base_yaw: 0.0
  shoulder_pitch: 0.15
  elbow_pitch: -0.1
approach_settle_s: 1.0

# Deltas applied to the arm's joint pose (radians) for the lift/lower
# steps, added to / subtracted from grasp_pose.
lift_delta:
  shoulder_pitch: -0.2
  elbow_pitch: 0.1
lower_settle_s: 1.0
