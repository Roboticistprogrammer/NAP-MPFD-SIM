# SC-04: Variable approach orientation (Scenarios.md)
# "Object rotated/offset between trials, same grasp target"
#
# Each entry overrides the active object's world_pose (objects.yaml)
# for one trial — run_scenario.py selects which entry via
# --orientation-index (defaults to 0). The grasp target (grasp_pose)
# stays fixed across all entries per the scenario definition; only the
# object moves.
scenario_id: SC04
hover_pose:
  x: 0.0
  y: 0.0
  z: -2.0
  yaw: 0.0
hold_duration_s: 5.0
condition_label: normal
land_at_end: true
outcome_z_drop_threshold_m: 0.02
outcome_sample_interval_s: 0.5

approach_pose:
  base_yaw: 0.0
  shoulder_pitch: 0.15
  elbow_pitch: -0.1
approach_settle_s: 1.0

orientation_overrides:
  # [x, y, z, roll, pitch, yaw], world frame. Index 0 matches
  # objects.yaml's default world_pose (control/baseline trial).
  - [0.15, 0.0, 0.05, 0, 0, 0.0]
  - [0.15, 0.0, 0.05, 0, 0, 0.78]
  - [0.15, 0.0, 0.05, 0, 0, 1.57]
  - [0.13, 0.02, 0.05, 0, 0, 0.0]
  - [0.17, -0.02, 0.05, 0, 0, 0.0]
